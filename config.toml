start = "2020-01-01"
split_date = "2024-01-01"        # in-sample < split_date <= out-of-sample (params are fixed, not fitted)
# end = "2025-12-31"             # default: today
db_path = "ohlcv.db"

initial_cash = 10_000_000        # KRW
# Verify against your broker's fee schedule and the current KRX tax rate before trusting results.
commission = 0.00015             # per side
sell_tax = 0.0020                # securities transaction tax, sell side only
slippage = 0.001                 # applied against you on every fill

fast = 20
slow = 60

# --- Phase 2 (KIS mock trading) ---
kis_min_interval = 1.0           # seconds between KIS calls (mock returns HTTP 500 when hit faster)
max_daily_loss_pct = 3.0         # kill switch: equity down this % vs the previous run's equity
max_drawdown = 0.15              # kill switch: equity below (1 - this) * peak equity since start
trade_window_start = "09:00"     # KST: orders only inside this window on trading days (--dry-run ignores it)
trade_window_end = "09:30"
cash_buffer = 0.01               # size buys as if price were 1% higher (covers open gap + fees)

# Live/paper universe. Previous 5-name list (fits a 10M slice): ["005930", "035420", "005380", "105560", "017670"]
# Small-account test: cheap names (prices 2026-10-03: 30k, 33k, 35k) so one share fits a slice of the budget below.
live_tickers = ["015760", "035720", "251270"]
# The bot's own sleeve: required. trading.py tracks its cash and positions in state.json;
# kill switch, sizing and P&L use the sleeve, not the mock account (10M, cannot change).
# budget_krw = TOTAL capital deposited so far (P&L base). To add capital: raise it AND run `python deposit.py AMOUNT --confirm`
# (adds the cash and shifts the kill-switch baselines so the deposit is not counted as profit). 140,000 + 2,860,000 on 2026-10-06.
budget_krw = 3_000_000

